name: Daily Random Commits

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  random-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Git
        run: |
          git config user.name "soumyadeepjana1"
          git config user.email "soumyadeepjana368@gmail.com"
      
      - name: Do Everything
        run: |
          git pull origin master
          NUM_COMMITS=$(( RANDOM % 5 + 1 ))
          mkdir -p streak-data
          for i in $(seq 1 $NUM_COMMITS); do
            echo "Commit $i" >> streak-data/streak.txt
            git add streak-data/
            git commit -m "Streak commit $i"
            sleep 2
          done
          git push origin master
